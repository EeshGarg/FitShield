<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="whatsNewTitle">What's new</title>
  <link rel="stylesheet" href="fitshield-layout.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: rgba(21, 27, 35, 0.92);
      --border: rgba(126, 240, 168, 0.18);
      --text: #f3f8fb;
      --muted: #a8b4c3;
      --accent: #7ef0a8;
      --panel-radius: 20px;

      /* Derived from the live palette: whats-new.js writes the stored preset
         into these variables without adding a `.theme-light` class, so a rule
         cannot ask which theme is active. Mixing against --text/--bg answers
         correctly in both. Same tokens as the block page. */
      --surface: color-mix(in srgb, var(--text) 12%, var(--bg));
      --accent-text: color-mix(in srgb, var(--accent) 65%, var(--text));
      --accent-tint: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 48px 24px;
      background:
        radial-gradient(130% 70% at 50% -5%, color-mix(in srgb, var(--text) 3%, transparent), transparent 60%),
        linear-gradient(180deg, color-mix(in srgb, var(--text) 3%, var(--bg)) 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Segoe UI", -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    }

    .wrap { width: min(100%, 680px); }

    header { text-align: center; margin-bottom: 28px; }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-tint);
      color: var(--accent-text);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.2rem); }

    header p { margin: 0; color: var(--muted); }

    .release {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--panel-radius);
      padding: 22px 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      margin-bottom: 16px;
    }

    .release.current { border-color: color-mix(in srgb, var(--accent) 55%, var(--bg)); }

    .release-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .release-version { font-size: 1.15rem; font-weight: 700; }
    .release-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent-text);
      background: var(--accent-tint);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .release-date { font-size: 0.82rem; color: var(--muted); }
    .release-title { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }

    ul { margin: 0; padding-inline-start: 20px; }
    li { margin-bottom: 8px; line-height: 1.5; color: var(--text); }

    .actions { text-align: center; margin-top: 24px; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #102016;
    }
    button.secondary { background: var(--surface); color: var(--text); margin-inline-start: 10px; }

    .empty { color: var(--muted); text-align: center; }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <span class="eyebrow">FitShield</span>
      <h1 data-i18n="whatsNewTitle">What's new</h1>
      <p id="subtitle" data-i18n="whatsNewSubtitle">A quick look at what changed.</p>
    </header>

    <div id="releases"></div>

    <div class="actions">
      <button id="openSettings" type="button" data-i18n="whatsNewOpenSettings">Open settings</button>
      <button id="close" class="secondary" type="button" data-i18n="whatsNewClose">Close</button>
    </div>
  </main>

  <script src="ambient.js" data-energy="lively"></script>
  <script src="browser-shim.js"></script>
  <script src="i18n.js"></script>
  <!-- For the theme-mode helpers only. This page used to read `theme` alone and
       therefore stayed dark while the popup went light on a System + light-OS
       profile; resolving the mode the same way every other surface does means
       re-using the same implementation rather than copying it. -->
  <script src="fitshield-core.js"></script>
  <script src="whats-new.js"></script>
</body>
</html>
