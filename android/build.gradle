// Root Gradle file for the FitShield Android adapter. Builds a debug APK or a
// release AAB when the Android SDK (API 35) + Gradle are available. Verified
// on-device (Samsung, Android 14). AGP 8.6 + Gradle 8.7 target compileSdk 35.
plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
